[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chainwatch-payments"
version = "0.1.0"
description = "Watch-only, multi-chain crypto payment detection: derive receive addresses from xpubs and confirm incoming payments. No private keys, no gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adeniyi Oluwadamilare" }]
keywords = ["bitcoin", "tron", "usdt", "usdc", "erc20", "trc20", "payments", "xpub", "watch-only"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
# Core has NO required dependencies: pure-Python fallbacks for all crypto.
dependencies = []

[project.optional-dependencies]
# Each extra brings the HTTP transport for that chain's default source plus
# optional C-accelerated crypto (libsecp256k1, keccak). Without them the
# package still works using its pure-Python implementations.
bitcoin = ["httpx>=0.27", "coincurve>=20"]
tron = ["httpx>=0.27", "coincurve>=20", "pycryptodome>=3.20"]
evm = ["httpx>=0.27", "coincurve>=20", "pycryptodome>=3.20"]
all = ["chainwatch-payments[bitcoin,tron,evm]"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/chainwatch_payments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
