[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chainwatch-payments"
dynamic = ["version"]
description = "Watch-only, multi-chain crypto payment detection: derive receive addresses from xpubs and confirm incoming payments. No private keys, no gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Adeniyi Oluwadamilare" }]
keywords = ["django", "bitcoin", "tron", "usdt", "usdc", "erc20", "trc20", "payments", "xpub", "watch-only"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
# Core has NO required dependencies: pure-Python fallbacks for all crypto.
dependencies = []

[project.optional-dependencies]
# Each chain extra brings the HTTP transport for that chain's default source
# (plus a fast Keccak for TRON/EVM). `fast` adds libsecp256k1 bindings for
# quicker derivation; it may need a C compiler on very new Pythons, so it is
# kept separate. Without it the pure-Python implementation gives identical results.
bitcoin = ["httpx>=0.27"]
tron = ["httpx>=0.27", "pycryptodome>=3.20"]
evm = ["httpx>=0.27", "pycryptodome>=3.20"]
fast = ["coincurve>=20"]
# Django integration: abstract invoice model, poll command, signals.
django = ["django>=4.2"]
# OPT-IN hot-wallet forwarder for TRON (signs transactions; see README "Forwarding").
forwarder = ["tronpy>=0.5"]
all = ["chainwatch-payments[bitcoin,tron,evm]"]
test = ["pytest>=8", "pytest-django>=4.8", "django>=4.2"]

[tool.hatch.version]
# Single source of truth: __version__ in the package. Bump it there only.
path = "src/chainwatch_payments/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chainwatch_payments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "UP007",  # keep Optional/Union style choices free
    "B008",   # function calls in defaults are used deliberately (Decimal("0"))
    "E731",   # small lambdas in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011", "E501"]
"scripts/*" = ["E501"]
"src/chainwatch_payments/crypto/hashes.py" = ["E741"]

[tool.mypy]
python_version = "3.10"
files = ["src/chainwatch_payments"]
exclude = ["migrations/"]
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
# The Django integration is checked loosely (no django-stubs plugin required).
[[tool.mypy.overrides]]
module = ["chainwatch_payments.contrib.*"]
disallow_untyped_defs = false
# Django TextChoices members look like tuples without the django-stubs plugin
disable_error_code = ["arg-type"]
